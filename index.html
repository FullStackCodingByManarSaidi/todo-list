
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ma To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Ma To-Do List</h1>
            <p>Organise tes tâches et reste productive !</p>
        </header>

        <form id="taskForm">
            <input
                type="text"
                id="taskInput"
                placeholder="Ajouter une nouvelle tâche..."
                autocomplete="off"
            >

            <button type="submit">Ajouter</button>
        </form>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">
                Toutes
            </button>

            <button class="filter-btn" data-filter="active">
                En cours
            </button>

            <button class="filter-btn" data-filter="completed">
                Terminées
            </button>
        </div>

        <ul id="taskList"></ul>

        <p id="taskCount">0 tâche restante</p>

    </div>

    <script src="script.js"></script>
    <!-- Version 2 : amélioration du projet -->
</body>
</html>
